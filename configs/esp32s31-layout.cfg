# Derived from Espressif esp-linux-bsp commit
# a77a06f03068d25799ddd719566df50207f28c5a.
# Modified for the SMP/XIP/SquashFS/persistent-storage layout.
#
# ESP32-S31 NOR layout shared by image packaging and partial flash targets.
# Keep this file shell-compatible: tools/build/flash_image.sh and the
# Makefile flash recipes source it directly.

CHIP=esp32s31
SPL_SRAM_ADDR=0x2F040000
ESPTOOL_FLASH="--flash-mode dio --flash-freq 80m --flash-size 16MB"

# Raw flash slots, ordered by physical offset. All sizes use binary KiB.
# The ROM reserves [0, 0x2000) for FlashEncryption metadata. SPL is strictly
# 48 KiB. Every byte after the reservation belongs to a slot: no gaps.
# Map raw flash [0, 16 MiB) linearly at physical 0x40000000. Linux starts
# at 0x40400000, a 4 MiB Sv32 megapage boundary (upstream issue #1).
# Persist takes all remaining partitionable space; only slot-wise flashing
# preserves it. A padded combined image can overwrite persisted data.
SLOT_SPL=0x002000
SIZE_SPL=0x00C000
SLOT_UBOOT_ITB=0x00E000
SLOT_DTB=0x05E000
SLOT_RADIO=0x06E000
SLOT_PERSIST=0x1EE000
SLOT_KERNEL=0x400000
SLOT_ROOTFS=0xA00000
FLASH_SIZE=0x1000000

# Artifact names within out/images/.
SPL_DTB_BIN=u-boot-spl-dtb.bin
SPL_APP_BIN=spl_app.bin
UBOOT_ITB=u-boot.itb
BASE_DTB=esp32s31_generic.dtb
RADIO_IMAGE=radio.bin
KERNEL_IMAGE=xipImage
PERSIST_IMAGE=persist.jffs2
ROOTFS_IMAGE=rootfs.sqfs
OUT_IMAGE=s31_full_flash.bin
