flash s31-nor {
	pebsize = 8192
	numpebs = 2048
	minimum-io-unit-size = 1
}

image s31_full_flash.bin {
	flash {}
	flashtype = "s31-nor"
	partition spl {
		image = "spl_app.bin"
		offset = 0x2000
		size = 48K
	}
	partition u-boot {
		image = "u-boot.itb"
		offset = 0xE000
		size = 320K
	}
	partition dtb {
		image = "esp32s31-i80-ili9341.dtb"
		offset = 0x5E000
		size = 64K
	}
	partition radio {
		image = "radio.bin"
		offset = 0x6E000
		size = 1792K
	}
	partition persist {
		offset = 0x22E000
		size = 1864K
	}
	partition kernel {
		image = "xipImage"
		offset = 0x400000
		size = 6M
	}
	partition rootfs {
		image = "rootfs.squashfs"
		offset = 0xA00000
		size = 6M
	}
}
