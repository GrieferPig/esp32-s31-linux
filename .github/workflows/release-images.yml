name: Build S31 Images

on:
  push:
    branches: [main, feature/p4-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      BR2_JLEVEL: '4'

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates cpio curl device-tree-compiler file flex \
            git gperf jq libelf-dev libncurses-dev libssl-dev patch perl pkg-config python3 \
            rsync squashfs-tools swig u-boot-tools unzip wget xz-utils

      - name: Build S31 full-flash images
        run: make TARGET=esp32s31 JOBS="$BR2_JLEVEL" image

      - name: Stage full-flash images
        run: |
          mkdir -p "$RUNNER_TEMP/full-flash-images"
          install -m 0644 \
            out-buildroot-esp32s31/images/s31-{generic,coreboard}_full_flash.bin \
            out-buildroot-esp32s31-korvo/images/s31-korvo_full_flash.bin \
            "$RUNNER_TEMP/full-flash-images/"

      - name: Upload full-flash images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-flash-images-${{ github.sha }}
          path: ${{ runner.temp }}/full-flash-images/
          if-no-files-found: error

      - name: Prepare release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${COMMIT_MESSAGE#release:}"
          subject="$(printf '%s' "$subject" | tr '\n' ' ' | sed 's/^[[:space:]]*//')"
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          printf 'tag=ci-%s-%s\n' "${GITHUB_SHA:0:12}" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'title=%s: %s\n' "$timestamp" "$subject" >> "$GITHUB_OUTPUT"

      - name: Publish full-flash images to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP"/full-flash-images/*.bin \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --notes-file buildroot-external/board/esp32-s31/release-notes.md
