name: Release S31 Images

on:
  push:
    branches: [main, feature/p4-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/fast-checks.yml
    permissions:
      contents: read
  build-and-release:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/p4-integration' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      OUT: out-buildroot-esp32s31
      BR2_JLEVEL: '4'

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out Buildroot
        run: git submodule update --init --depth 1 buildroot

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates cpio curl file flex \
            git libncurses-dev libssl-dev patch perl python3 rsync \
            unzip wget xz-utils squashfs-tools

      - name: Build S31 Linux, rootfs and NOR image
        run: make TARGET=esp32s31 JOBS="$BR2_JLEVEL" image

      - name: Upload built images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s31-images-${{ github.sha }}
          path: |
            out-buildroot-esp32s31/images/*.bin
            out-buildroot-esp32s31/images/*.itb
            out-buildroot-esp32s31/images/*.dtb
            out-buildroot-esp32s31/images/xipImage
            out-buildroot-esp32s31/images/rootfs.squashfs
            out-buildroot-esp32s31/images/radio.json
            out-buildroot-esp32s31/images/SHA256SUMS
          if-no-files-found: error

      - name: Prepare release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${COMMIT_MESSAGE#release:}"
          subject="$(printf '%s' "$subject" | tr '\n' ' ' | sed 's/^[[:space:]]*//')"
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          printf 'tag=ci-%s-%s\n' "${GITHUB_SHA:0:12}" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'title=%s: %s\n' "$timestamp" "$subject" >> "$GITHUB_OUTPUT"

      - name: Publish full-flash image to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          cp buildroot-external/board/esp32-s31/release-notes.md "$RUNNER_TEMP/image-release-notes.md"
          gh release create "$RELEASE_TAG" \
            "$OUT/images/s31_full_flash.bin" "$OUT/images/SHA256SUMS" \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/image-release-notes.md"
