name: Release S31 Images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IDF_PATH: ${{ github.workspace }}/.esp-idf
      ESP_IDF_REF: a602e67b0bf9ee0806dc4e1df7afc9affedf5c33
      TOOLCHAIN_RELEASE_TAG: esp32s31-linux-gcc-15.2.0-4
      TOOLCHAIN_BUILD_ID: esp-16.0.0_00000000.32-8c983cc

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison bc build-essential ccache cpio device-tree-compiler flex gperf libffi-dev \
            libssl-dev ninja-build rsync unzip

      - name: Install ESP-IDF
        run: |
          git clone --filter=blob:none https://github.com/espressif/esp-idf.git "$IDF_PATH"
          git -C "$IDF_PATH" checkout "$ESP_IDF_REF"
          "$IDF_PATH/install.sh" esp32s31

      - name: Install and verify pinned toolchain
        run: |
          make TOOLCHAIN_RELEASE_TAG="$TOOLCHAIN_RELEASE_TAG" toolchain
          prefix="$GITHUB_WORKSPACE/toolchain/riscv32-esp-linux-musl"
          target=riscv32-esp-linux-musl
          test "$(cat "$prefix/.release")" = "$TOOLCHAIN_RELEASE_TAG"
          "$prefix/bin/$target-gcc" --version | grep -q "$TOOLCHAIN_BUILD_ID"
          grep -q '^CT_PATCH_BUNDLED=y$' "$prefix/crosstool-ng.config"
          grep -q '^CT_PATCH_ORDER="bundled"$' "$prefix/crosstool-ng.config"
          grep -q '^7059e060975400cd90418972dc796eecb73e3ccf202ba5b5fba2577f7173ab90  packages/gcc/git-0dbf5849/0001-xesploop.patch$' "$prefix/s31-patch-sha256.txt"
          grep -q '^e67fecf41b29e47e2b8a62c705863dc27e5e442c65e0233c3cdefbb22d080c45  packages/gcc/git-0dbf5849/0002-riscv-xesploop-reject-early-exit-loops.patch$' "$prefix/s31-patch-sha256.txt"
          grep -q '^4660f48e98ff0da98171d84d44c8866fe9d8b399f8deccb9c1055837a4efee0e  packages/musl/1.2.5/0002-riscv32-add-xespv-string-operations.patch$' "$prefix/s31-patch-sha256.txt"
          mkdir -p build/toolchain-verify
          python3 -c 'from pathlib import Path; from scripts.wait_s31_toolchain_and_test import verify_compiler, verify_libc_xespv; p=Path("toolchain/riscv32-esp-linux-musl"); w=Path("build/toolchain-verify"); verify_compiler(p, w, Path.cwd()); verify_libc_xespv(p, w, Path.cwd())'
          libc="$prefix/$target/sysroot/usr/lib/libc.so"
          "$prefix/bin/$target-objdump" -d "$libc" > build/toolchain-verify/libc-disassembly.txt
          for symbol in memcpy memchr memrchr memcmp strcmp __riscv32_xespv_memcpy64; do
            grep -q "<${symbol}>:" build/toolchain-verify/libc-disassembly.txt
          done
          sed -n '/<memcpy>:/,/^$/p' build/toolchain-verify/libc-disassembly.txt \
            > build/toolchain-verify/memcpy-disassembly.txt
          grep -q '__riscv32_xespv_memcpy64' build/toolchain-verify/memcpy-disassembly.txt
          for symbol in memchr memrchr memcmp strcmp; do
            sed -n "/<${symbol}>:/,/^$/p" build/toolchain-verify/libc-disassembly.txt \
              > "build/toolchain-verify/${symbol}-disassembly.txt"
            grep -q 'esp.vld.128.ip' "build/toolchain-verify/${symbol}-disassembly.txt"
            grep -q 'esp.vcmp.eq.u8' "build/toolchain-verify/${symbol}-disassembly.txt"
          done
          sed -n '/<__riscv32_xespv_memcpy64>:/,/^$/p' \
            build/toolchain-verify/libc-disassembly.txt \
            > build/toolchain-verify/memcpy-kernel-disassembly.txt
          grep -q 'esp.vld.128.ip' build/toolchain-verify/memcpy-kernel-disassembly.txt
          grep -q 'esp.vst.128.ip' build/toolchain-verify/memcpy-kernel-disassembly.txt
          sed -n '/<memset>:/,/^$/p' build/toolchain-verify/libc-disassembly.txt \
            > build/toolchain-verify/memset-disassembly.txt
          ! grep -q 'esp\.' build/toolchain-verify/memset-disassembly.txt

      - name: Build all images
        run: |
          source "$IDF_PATH/export.sh"
          make TOOLCHAIN_RELEASE_TAG="$TOOLCHAIN_RELEASE_TAG" \
            IDF_EXPORT="$IDF_PATH/export.sh" all
          make TOOLCHAIN_RELEASE_TAG="$TOOLCHAIN_RELEASE_TAG" coremark
          make TOOLCHAIN_RELEASE_TAG="$TOOLCHAIN_RELEASE_TAG" \
            IDF_EXPORT="$IDF_PATH/export.sh" bootloader

      - name: Verify release images
        run: |
          set -ex
          echo "=== Build Artifacts ==="
          ls -lh build/fw_payload.bin build/xipImage build/rootfs.sqfs
          ls -lh bootloader/build/bootloader/bootloader.bin 2>/dev/null || echo "WARN: bootloader.bin missing"
          ls -lh bootloader/build/hello_world.bin 2>/dev/null || echo "WARN: hello_world.bin missing"
          echo "=== sdkconfig ==="
          grep -E 'CONFIG_ESPTOOLPY_FLASHMODE|CONFIG_FLASHMODE' bootloader/sdkconfig || echo "WARN: flash mode config not in sdkconfig"
          echo "=== esptool ==="
          source "$IDF_PATH/export.sh"
          esptool version 2>/dev/null || echo "WARN: esptool not in IDF env"
          esptool --chip esp32s31 image-info \
            bootloader/build/bootloader/bootloader.bin 2>&1 | head -5 || echo "WARN: esptool image-info failed"
          echo "=== Core checks ==="
          test -s build/fw_payload.bin
          test -s build/xipImage
          test -s build/rootfs.sqfs
          echo "All core artifacts verified OK"

      - name: Prepare release metadata
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${COMMIT_MESSAGE#release:}"
          subject="$(printf '%s' "$subject" | tr '\n' ' ' | sed 's/^[[:space:]]*//')"
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          printf 'tag=ci-%s-%s\n' "${GITHUB_SHA:0:12}" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'title=%s: %s\n' "$timestamp" "$subject" >> "$GITHUB_OUTPUT"

      - name: Publish images to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          FLASH_COMMAND: esptool -p /dev/ttyUSB0 -b 2000000 erase-flash && esptool -p /dev/ttyUSB0 -b 2000000 write-flash --flash-mode dio --flash-freq 80m --flash-size 16MB 0x2000 bootloader.bin 0x8000 partition-table.bin 0x20000 hello_world.bin 0x220000 fw_payload.bin 0x400000 xipImage 0xA00000 rootfs.sqfs
        run: |
          gh release create "$RELEASE_TAG" \
            build/fw_payload.bin \
            build/xipImage \
            build/rootfs.sqfs \
            build/esp32s31_generic.dtb \
            bootloader/build/bootloader/bootloader.bin \
            bootloader/build/partition_table/partition-table.bin \
            bootloader/build/hello_world.bin \
            --title "$RELEASE_TITLE" \
            --notes "$FLASH_COMMAND"
