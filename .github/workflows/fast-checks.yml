name: Port checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc device-tree-compiler gcc-riscv64-linux-gnu
          python3 -m venv /tmp/s31-checks
          /tmp/s31-checks/bin/pip install -r docs/requirements.txt dtschema==2026.6
          echo /tmp/s31-checks/bin >> "$GITHUB_PATH"
      - name: Host regressions and strict documentation
        run: make check-host check-docs
      - name: Device tree and binding diagnostics
        run: python3 tools/check_s31_dt.py --cross-compile riscv64-linux-gnu-
