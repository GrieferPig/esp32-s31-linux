name: Buildroot configuration checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure S31
        run: |
          git submodule update --init --depth 1 buildroot
          make TARGET=esp32s31 OUT_ROOT="$RUNNER_TEMP/esp32s31" config
